<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14210C"/>
      <stop offset="0.55" stop-color="#1E2C17"/>
      <stop offset="1" stop-color="#26351F"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#9FBF60" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#9FBF60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.06" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#4F7A63" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#4F7A63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1128" height="191" fill="url(#bg)"/>
  <rect width="1128" height="191" fill="url(#dots)"/>
  <rect width="1128" height="191" fill="url(#glowR)"/>
  <rect width="1128" height="191" fill="url(#glowL)"/>

  <!-- Lockup: mark + wordmark, vertically centered -->
  <g transform="translate(402,41)">
    <!-- mark, 32x32 scaled x2.6 = 83 -->
    <g transform="scale(2.6)">
      <path d="M16 3 5 7.5V15c0 6.5 4.8 10.8 11 13 6.2-2.2 11-6.5 11-13V7.5Z" fill="#AACB76"/>
      <path d="M16 20c-4.2-3.2-6.5-5-6.5-7.6A2.8 2.8 0 0 1 16 10.3a2.8 2.8 0 0 1 6.5 2.1c0 2.6-2.3 4.4-6.5 7.6Z" fill="#17230F"/>
    </g>
    <text x="104" y="62" font-family="Fraunces" font-weight="500" font-size="70" letter-spacing="-1.4" fill="#F4F7EC">Medyra</text>
  </g>

  <!-- hero tagline -->
  <text x="564" y="158" text-anchor="middle" font-family="Fraunces" font-weight="400" font-style="italic" font-size="25" letter-spacing="0.2" fill="#B9CBA2">One calm chart for the whole clinic</text>
</svg>
